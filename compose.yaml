services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abhijatri
      POSTGRES_USER: abhijatri
      POSTGRES_PASSWORD: abhijatri_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abhijatri -d abhijatri"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - abhijatri_pgdata:/var/lib/postgresql/data

  # Local stand-in for Upstash (visit and ops event counters). REDIS_URL=redis://localhost:6379/0
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  abhijatri_pgdata:

