[project]
name = "abhijatri-backend"
version = "0.1.0"
description = "Abhijatri review vertical slice"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=8.1.0",
  "slowapi>=0.1.9,<1",
  "sqlalchemy>=2.0,<3",
  "truststore>=0.10,<1",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "pip-audit>=2.7,<3",
  "mypy>=1.13,<2",
  "fakeredis>=2.26,<3",
  "pyotp>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a real PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]
branch = true


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# B008: FastAPI Depends()/Query() defaults; UP042/B904: existing str-enum and helper-raise style
ignore = ["E501", "B008", "UP042", "B904", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607", "S608"]
"scripts/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
