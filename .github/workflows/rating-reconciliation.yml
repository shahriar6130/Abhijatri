name: Nightly rating reconciliation

# Recomputes every destination's rating totals from the published review rows and compares them with the
# stored totals (Features/Review.md 6.3). Detect-only: it never changes a total; drift alerts superadmins.
# 18:45 UTC = 00:45 Asia/Dhaka, after the visit roll-up. Repair is a separate, explicit superadmin action.
on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Run the reconciliation
        env:
          OPS_API_URL: ${{ secrets.OPS_API_URL }}
          OPS_DASHBOARD_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
        run: |
          if [ -z "$OPS_API_URL" ] || [ -z "$OPS_DASHBOARD_TOKEN" ]; then
            echo "OPS_API_URL / OPS_DASHBOARD_TOKEN secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-all-errors \
            -X POST "${OPS_API_URL%/}/api/v1/ops/jobs/rating-reconciliation" \
            -H "Authorization: Bearer ${OPS_DASHBOARD_TOKEN}"
